<script>
  // Dark mode preload — prevents white flash on refresh
  (function() {
    try {
      var darkPref = localStorage.getItem('voxel1-dark-mode') || 'light'; // light by default; dark only when chosen
      var isDark = darkPref === 'dark' ||
        (darkPref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

      if (isDark) {
        // Apply dark class immediately — the .dark CSS rules in the static
        // hero <style> block handle background/text overrides for both the
        // skeleton and body, so no element lookups are needed here.
        document.documentElement.classList.add('dark');

        // Update theme-color meta tag to dark
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#0f172a');
      }
    } catch(e) {}
  })();
</script>
<style>
  /* Opening splash (animated by src/splash.ts) */
  #app-splash{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #app-splash .app-splash-bg{position:absolute;inset:0;background:#F4F6FA;transition:opacity .45s ease .2s}
  html.dark #app-splash .app-splash-bg{background:#0F1726}
  #app-splash .app-splash-logo{position:relative;width:88px;height:102px;transform-origin:center;animation:v1-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
  #app-splash .app-splash-logo img{width:100%;height:100%;display:block;animation:v1-breathe 1.6s ease-in-out .75s infinite}
  #app-splash .app-splash-shine{position:absolute;inset:0;overflow:hidden;-webkit-mask:url(/img/employee-day-mark.png) center/contain no-repeat;mask:url(/img/employee-day-mark.png) center/contain no-repeat}
  #app-splash .app-splash-shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-15deg);animation:v1-shine 1.6s ease-in-out .5s infinite}
  #app-splash.is-flying .app-splash-logo{animation:none;transition:transform .7s cubic-bezier(.65,0,.25,1)}
  #app-splash.is-flying .app-splash-logo img{animation:none}
  #app-splash.is-flying .app-splash-shine{display:none}
  #app-splash.is-flying .app-splash-bg,#app-splash.is-fading{opacity:0}
  #app-splash.is-fading{transition:opacity .35s ease}
  @keyframes v1-pop{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:scale(1)}}
  @keyframes v1-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes v1-shine{0%{left:-60%}60%,100%{left:120%}}
  @media (prefers-reduced-motion:reduce){#app-splash *{animation:none!important}}
</style>

<body class="bg-[#fcfdfe] text-slate-900">

  <div id="root"></div>
<script>
  // Capture install prompt event (must be inline, not in ESM module,
  // because on slower devices beforeinstallprompt fires before modules load)
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window.deferredPWAPrompt = e;
    window.dispatchEvent(new CustomEvent('pwa-install-available'));
    console.log('PWA: Install prompt captured');
  });

  // Track successful installation
  window.addEventListener('appinstalled', function() {
    console.log('PWA: Successfully installed');
    window.deferredPWAPrompt = null;
    window.dispatchEvent(new CustomEvent('pwa-installed'));
  });
</script>
<script type="module" src="/src/index.tsx"></script>
</body>
